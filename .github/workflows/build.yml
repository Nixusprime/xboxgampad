name: Build XboxPad APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Phone-friendly: upload xboxpad.zip to the repo and it gets unpacked here.
      # If you uploaded the project files directly instead, this step is skipped.
      - name: Unpack project
        run: |
          if [ -f xboxpad.zip ]; then
            mkdir -p project
            unzip -o xboxpad.zip -d project
          else
            mkdir -p project
            shopt -s dotglob
            for f in *; do [ "$f" != "project" ] && [ "$f" != ".git" ] && [ "$f" != ".github" ] && cp -r "$f" project/; done
          fi
          true
          ls -R project | head -40

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: XboxPad-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: XboxPad build ${{ github.run_number }}
          files: project/app/build/outputs/apk/debug/app-debug.apk
